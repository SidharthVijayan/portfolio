<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Alt Text Auditor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <h1 id="appName">Image Alt Text Auditor</h1>
  </header>
  <button id="runBtn" class="primary">Audit images on this page</button>
  <p id="status" class="muted" role="status">Lists the images on the current tab and checks their alt text.</p>
  <section id="summary" hidden></section>
  <div id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-kind="issues" aria-selected="true">Issues</button>
    <button type="button" role="tab" data-kind="all" aria-selected="false">All</button>
    <button type="button" role="tab" data-kind="decorative" aria-selected="false">Decorative</button>
  </div>
  <section id="results" hidden></section>
  <div id="toolbar" hidden>
    <button id="copyBtn" type="button">Copy report</button>
  </div>
  <footer class="muted">Runs locally. Nothing is sent to us or any server. "Show on page" scrolls to the image and outlines it briefly.</footer>
  <script src="../lib/core.js"></script>
  <script src="../../_shared/chrome-shim.js"></script>
  <script src="popup.js"></script>
</body>
</html>
