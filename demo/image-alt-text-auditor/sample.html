<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; media-src 'self' data:; base-uri 'none';">
  <meta charset="utf-8">
  <title>Ridge Loop Trail guide | Example Trails (demo page)</title>
  <style>body{margin:0;font-family:system-ui,Arial;color:#1f2937;background:#f8fafc}header{display:flex;align-items:center;gap:16px;padding:14px 32px;background:#fff;border-bottom:1px solid #e2e8f0}main{max-width:980px;margin:0 auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid img{width:100%;height:auto;border-radius:8px;display:block}.hero{width:100%;height:auto;border-radius:10px;display:block}form{margin-left:auto;display:flex;gap:6px;align-items:center}input[type=text]{padding:8px;border:1px solid #cbd5e1;border-radius:6px}h1{margin:18px 0 6px}.star{vertical-align:middle}</style>
</head>
<body>
  <header>
    <a href="/"><img src="/img/logo.png" alt="" width="160" height="48"></a>
    <form action="/search"><input type="text" name="q" aria-label="Search trails"><input type="image" src="/img/search.png" width="40" height="40"></form>
  </header>
  <main>
    <img class="hero" src="/img/trail-hero.png" width="960" height="360">
    <h1>Ridge Loop Trail <span aria-hidden="true"><img class="star" src="/img/icon-star.png" width="24" height="24"></span> 4.8</h1>
    <p>Demo page with planted alt text mistakes for Image Alt Text Auditor tests.</p>
    <img src="/img/divider.png" alt="" role="presentation" width="600" height="16">
    <div class="grid">
      <img src="/img/IMG_2041.png" alt="IMG_2041.JPG" width="420" height="280">
      <img src="/img/map.png" alt="image" width="420" height="280">
      <img src="/img/peak-a.png" alt="Mountain view" width="420" height="280">
      <img src="/img/peak-b.png" alt="Mountain view" width="420" height="280">
    </div>
    <img src="/img/spacer.png" alt="" width="300" height="24">
  </main>
</body>
</html>
