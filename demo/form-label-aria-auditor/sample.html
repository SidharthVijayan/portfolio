<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; media-src 'self' data:; base-uri 'none';">
<meta charset="UTF-8">
<title>Order a celebration cake | Lakeside Bakery (demo page)</title>
<style>
body{margin:0;font:16px/1.5 Georgia,serif;background:#fffaf3;color:#3b2a1a}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 40px;background:#7c2d12;color:#fff}
header b{font-size:22px} header button{background:transparent;color:#fff;border:1px solid #fed7aa;border-radius:6px;padding:4px 12px;font:inherit}
main{max-width:620px;margin:0 auto;padding:24px 40px 80px}
h1{font-size:30px;margin:0 0 6px} p.lead{margin:0 0 20px;color:#57534e}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;background:#fff;border:1px solid #fed7aa;border-radius:10px;padding:22px}
.full{grid-column:1/-1} label,.lbl{display:block;font-size:14px;font-weight:bold;margin-bottom:4px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid #d6d3d1;border-radius:6px;background:#fff}
input[type=checkbox]{width:auto} .row{display:flex;align-items:center;gap:10px}
.actions{display:flex;gap:10px;align-items:center} .actions button{background:#c2410c;color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:bold}
.icon{width:42px;height:42px;padding:0!important;background:#fed7aa!important;color:#7c2d12!important}
.ghost{position:fixed;right:20px;bottom:20px;background:#1c1917;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px}
.ghost button{background:#44403c;color:#fff;border:0;border-radius:4px;padding:3px 8px;margin-left:8px}
</style>
</head>
<body>
<header><b>Lakeside Bakery</b><button type="button" aria-controls="menu-panel" aria-expanded="false">Menu</button></header>
<main>
<h1>Order a celebration cake</h1>
<p class="lead">Demo page for testing. Tell us what you'd like and we'll call to confirm.</p>
<form action="#" method="post">
<input type="hidden" name="csrf" value="demo">
<div><input type="text" id="fullname" name="fullname" placeholder="Your name"></div>
<div><label for="mail">Email</label><input type="email" id="email" name="email"></div>
<div><label for="phone">Phone</label><input type="tel" id="phone" name="phone"></div>
<div><span class="lbl">Cake size</span><select id="size" name="size" aria-labelledby="size-label"><option>6 inch</option><option>8 inch</option></select></div>
<div><span class="lbl" id="pickup-label">Pickup time</span><input type="time" id="pickup" name="pickup" aria-labelledby="pickup-label"></div>
<div><span class="lbl" id="pickup-label">Pickup date</span><input type="date" id="pickupdate" name="pickupdate" title="Pickup date"></div>
<div class="full"><label>Message on the cake<textarea name="message" rows="2" aria-describedby="msg-hint"></textarea></label></div>
<div class="full row"><input type="checkbox" id="news" name="news"><span>Send me seasonal offers</span></div>
<div style="display:none"><label for="promo">Promo code</label><input type="text" id="promo" name="promo"></div>
<div class="full actions">
<button type="submit" aria-label="Send">Place order</button>
<button type="button" class="icon"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10h16M10 2v16" stroke="currentColor" stroke-width="3"/></svg></button>
<input type="image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='10' cy='10' r='6' fill='none' stroke='%237c2d12' stroke-width='3'/%3E%3Cpath d='M15 15l6 6' stroke='%237c2d12' stroke-width='3'/%3E%3C/svg%3E" width="42" height="42" style="width:42px;padding:8px;background:#fed7aa">
</div>
</form>
</main>
<div class="ghost" aria-hidden="true">Free delivery this week <button type="button">Close</button></div>
</body>
</html>
