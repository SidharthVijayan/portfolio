<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; media-src 'self' data:; base-uri 'none';">
  <meta charset="UTF-8">
  <title>Menu | Demo Bakery</title>
  <style>
    body { font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 400; }
    h1 { font-family: "Playfair Display", Georgia, serif; font-size: 32px; font-weight: 700; }
    h2 { font-family: "Playfair Display", Georgia, serif; font-size: 22px; font-weight: 700; }
    .price { font-family: "Source Sans 3", Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .note { font-family: Georgia, "Times New Roman", serif; font-size: 13px; font-style: italic; }
    .hidden { display: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <header>
    <h1>Weekend Menu</h1>
    <p class="note">Fresh from the oven each Saturday morning.</p>
  </header>
  <main>
    <h2>Breads</h2>
    <ul>
      <li>Sourdough loaf <span class="price">$6.50</span></li>
      <li>Rye batard <span class="price">$7.00</span></li>
      <li>Sesame roll <span class="price">$2.25</span></li>
    </ul>
    <h2>Pastries</h2>
    <p>Butter croissant and almond twist.</p>
    <p class="hidden">This should not be counted.</p>
    <span class="sr">Screen reader only</span>
  </main>
  <footer>
    <p>Demo Bakery · Open Sat 8am–2pm</p>
  </footer>
  <script>/* ignored */</script>
  <style>.x{font-family:Comic Sans MS}</style>
</body>
</html>
