<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyboard Focus Order Visualizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <h1>Keyboard Focus Order Visualizer</h1>
  </header>
  <p id="status" class="muted" role="status">Reading the Tab order of this page…</p>
  <div id="filters" role="group" aria-label="Show">
    <button type="button" class="chip" data-group="all" aria-pressed="true">Tab order <span id="nAll">0</span></button>
    <button type="button" class="chip check" data-group="check" aria-pressed="false">Check <span id="nCheck">0</span></button>
    <button type="button" class="chip skipped" data-group="skipped" aria-pressed="false">Not reached <span id="nSkipped">0</span></button>
  </div>
  <p id="groupNote" class="muted"></p>
  <ol id="list" aria-label="Tab stops in order"></ol>
  <div id="toolbar">
    <button id="layerBtn" type="button" aria-pressed="true" disabled>Hide numbers</button>
    <button id="copyBtn" class="primary" type="button" disabled>Copy report</button>
    <button id="csvBtn" type="button" disabled>Download CSV</button>
  </div>
  <footer class="muted">Numbers stay on the page until you press Esc, click Hide numbers or reload. Press Tab on the page to follow along. The page's content is not changed; nothing is sent or stored. By InnerShift Lab.</footer>
  <script src="../lib/core.js"></script>
  <script src="../../_shared/chrome-shim.js"></script>
  <script src="popup.js"></script>
</body>
</html>
