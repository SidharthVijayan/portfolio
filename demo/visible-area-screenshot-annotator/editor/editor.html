<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screenshot Annotator</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <div class="titles">
      <h1>Visible Area Screenshot Annotator</h1>
      <p id="pageInfo" class="muted">Loading the capture…</p>
    </div>
  </header>

  <div id="toolbar" role="toolbar" aria-label="Annotation tools">
    <div class="group" aria-label="Tool">
      <button id="toolBox" type="button" title="Box (B)" aria-pressed="true">▭ Box</button>
      <button id="toolArrow" type="button" title="Arrow (A)" aria-pressed="false">↗ Arrow</button>
      <button id="toolHighlight" type="button" title="Highlight (H)" aria-pressed="false">▮ Highlight</button>
      <button id="toolText" type="button" title="Text (T): click where the text should start" aria-pressed="false">T Text</button>
      <button id="toolRedact" type="button" title="Redact (R): covers an area with solid black" aria-pressed="false">■ Redact</button>
    </div>
    <div class="group" aria-label="Colour">
      <button id="col0" class="swatch" type="button" title="Red" aria-pressed="true"></button>
      <button id="col1" class="swatch" type="button" title="Amber" aria-pressed="false"></button>
      <button id="col2" class="swatch" type="button" title="Blue" aria-pressed="false"></button>
      <button id="col3" class="swatch" type="button" title="Green" aria-pressed="false"></button>
      <button id="col4" class="swatch" type="button" title="Black" aria-pressed="false"></button>
      <button id="col5" class="swatch" type="button" title="White" aria-pressed="false"></button>
    </div>
    <div class="group" aria-label="Line width">
      <button id="widthThin" type="button" title="Thin lines, small text" aria-pressed="true">Thin</button>
      <button id="widthThick" type="button" title="Thick lines, large text" aria-pressed="false">Thick</button>
    </div>
    <div class="group">
      <button id="undoBtn" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="redoBtn" type="button" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled>Redo</button>
      <button id="clearBtn" type="button" title="Remove all annotations (can be undone)" disabled>Clear</button>
    </div>
    <label class="group check" for="optStamp"><input id="optStamp" type="checkbox" disabled> Add page address and time</label>
    <div class="group end">
      <button id="copyBtn" type="button" title="Copy the annotated image (Ctrl+C)" disabled>Copy image</button>
      <button id="saveBtn" class="primary" type="button" title="Save as PNG (Ctrl+S)" disabled>Save PNG</button>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="message" class="message" hidden></div>

  <div id="stage">
    <canvas id="canvas" aria-label="Screenshot. Drag to draw with the selected tool."></canvas>
    <input id="textInput" type="text" maxlength="200" placeholder="Type, then press Enter" aria-label="Text label" hidden>
  </div>

  <footer class="muted">The capture lives only in this tab: nothing is uploaded or stored. Closing or reloading this tab discards it, so save or copy first.</footer>
  <script src="../lib/core.js"></script>
  <script src="../../_shared/chrome-shim.js"></script>
  <script src="editor.js"></script>
</body>
</html>
